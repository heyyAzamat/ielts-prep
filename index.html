        leaves:Array.from({length:kind==="grass"?0:Math.round(rr(1,4))},()=>({t:rr(.1,.6),len:rr(8,20)*sc,s:R()<.5?-1:1})),

  function draw(t){

      const g=ctx.createRadialGradient(x,y,0,x,y,m.r*5);g.addColorStop(0,`rgba(255,255,235,${a})`);g.addColorStop(1,"rgba(255,255,235,0)");

    const bt=ctx.createLinearGradient(0,H*.93,0,H);bt.addColorStop(0,"rgba(0,0,0,0)");bt.addColorStop(1,"rgba(0,0,0,1)");ctx.fillStyle=bt;ctx.fillRect(0,H*.93,W,H*.07);
  }
  let t0=performance.now(), px=0,py=0,tpx=0,tpy=0;
  const pm=e=>{tpx=e.clientX/innerWidth-.5;tpy=e.clientY/innerHeight-.5;};
  addEventListener("pointermove",pm,{passive:true});
  build();
  const loop=t=>{if(!cv.isConnected){removeEventListener("pointermove",pm);return;}draw(t);if(!reduce)gardenRAF=requestAnimationFrame(loop);};
  gardenRAF=requestAnimationFrame(loop);
  let rt; const ro=new ResizeObserver(()=>{if(!cv.isConnected){ro.disconnect();return;}clearTimeout(rt);rt=setTimeout(()=>{if(cv.clientWidth!==W||cv.clientHeight!==H){build();if(reduce)draw(0);}},150);});ro.observe(cv);
}

/* ---------- ambient fireflies & sparks ---------- */
const sparks=[];
function burst(x,y,n=24,kind="bright"){
  if(REDUCE)return;
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(kind==="soft"?.6:1.2)+Math.random()*(kind==="soft"?1.6:3.4);
    sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(kind==="soft"?.4:1.2),life:1,decay:.012+Math.random()*.02,r:.8+Math.random()*2,
      hue:Math.random()<.25?"233,169,75":Math.random()<.5?"190,255,225":"255,255,245"});}
  kickFx();
}
function celebrate(){ if(REDUCE)return; let k=0; const iv=setInterval(()=>{burst(innerWidth*(.2+Math.random()*.6),innerHeight*(.35+Math.random()*.4),28);if(++k>5)clearInterval(iv);},180); }
let fxRAF=0;
function kickFx(){ if(!fxRAF) fxRAF=requestAnimationFrame(fxLoop); }
function fxLoop(){
  const cv=$("#fx"),ctx=cv.getContext("2d"),d=Math.min(2,devicePixelRatio||1);
  if(cv.width!==innerWidth*d||cv.height!==innerHeight*d){cv.width=innerWidth*d;cv.height=innerHeight*d;}
  ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);ctx.globalCompositeOperation="lighter";
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vx*=.965;s.vy=s.vy*.965-.015;s.life-=s.decay;
    if(s.life<=0){sparks.splice(i,1);continue;}
    const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*5);g.addColorStop(0,`rgba(${s.hue},${s.life})`);g.addColorStop(1,`rgba(${s.hue},0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,s.r*5,0,6.283);ctx.fill();}
  fxRAF=sparks.length?requestAnimationFrame(fxLoop):0;
  if(!fxRAF)ctx.clearRect(0,0,innerWidth,innerHeight);
}

    flies=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:-.05-Math.random()*.2,r:.5+Math.random()*1.5,ph:Math.random()*6.28,sp:.4+Math.random()*1.2,warm:Math.random()<.18}));}

      const tw=REDUCE?.6:Math.pow(Math.abs(Math.sin(t/1000*f.sp+f.ph)),3);
      const a=.12+tw*.7, col=f.warm?"233,169,75":"210,255,235";
      const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*6);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(.3,`rgba(${col},${a*.35})`);g.addColorStop(1,`rgba(${col},0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,f.r*6,0,6.283);ctx.fill();
    }
    if(!REDUCE)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ---------- boot ---------- */
let sample=null;
store.initLocal();
go("home");
(async()=>{
  const cl=window.claude; if(!cl?.use)return;
  const [db,smp]=await Promise.all([cl.use("db").catch(()=>null),cl.use("sample").catch(()=>null)]);
  sample=smp;
  if(db){
    try{
      const [snap,st]=await Promise.all([db.collection("progress").get(),db.doc("meta/stats").get()]);
      const prog={}; snap.docs.forEach(d=>Object.assign(prog,JSON.parse(JSON.stringify(d.data().p||{}))));
      // перенести локальный прогресс, если в облаке пусто
      if(!snap.size && Object.keys(store.prog).length){ store.db=db; store.mode="db"; for(const id of Object.keys(store.prog)) store.set(id,store.prog[id]); }
      else store.prog=prog;
      store.db=db; store.mode="db";
      store.stats=st.exists?JSON.parse(JSON.stringify({days:{},...st.data()})):store.stats;
    }catch(e){}
  }
  if(current==="home"||current==="lesson"||current==="dict") go(current,arg);
})();
