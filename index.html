<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="600 слов из Essential Words for the IELTS: карточки RU/EN, словосочетания и задания с интервальными повторениями.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Слово за словом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600&display=swap">
<style>
:root{
  --night:#000000; --night-2:#0A0C0D; --night-3:#111415;
  --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.09); --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.2);
  --text:#F1F0EA; --text-2:#A3ABA5; --text-3:#6E7772;
  --moss:#8FC39A; --moss-bg:rgba(143,195,154,.12); --ember:#E9A94B; --teal:#4C9AA0; --bad:#E7887A; --bad-bg:rgba(231,136,122,.12);
  --sans:"Inter Tight","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --read:var(--sans);
  --serif:var(--sans);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{background:var(--night);color:var(--text);font:15px/1.55 var(--sans);font-weight:400;margin:0;padding-inline:16px;-webkit-font-smoothing:antialiased;overflow-x:clip}
.wrap{max-width:1040px;margin:0 auto;padding-block:0 70px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--moss);outline-offset:3px}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
em.s,.s{font-family:inherit;font-style:normal;font-weight:inherit;letter-spacing:inherit;font-size:inherit!important}
.muted{color:var(--text-2)}
.tn{font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);font-weight:500}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 0;background:linear-gradient(var(--night) 60%,transparent)}
.brand{font-size:15px;font-weight:500;letter-spacing:-.01em;background:none;border:0;padding:0}
.brand .s{font-size:18px}
nav{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.7);backdrop-filter:blur(10px)}
nav button{border:0;background:transparent;padding:6px 14px;border-radius:999px;color:var(--text-2);font-size:14px}
nav button:hover{color:var(--text)}
nav button[aria-current="page"]{background:var(--glass-2);color:var(--text)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--glass);padding:10px 18px;border-radius:999px;font-size:14px;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--line-2);background:var(--glass-2)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:6px 13px;font-size:13px}
.pearl{position:relative;border:0;border-radius:18px;padding:16px 30px;font-size:17px;font-weight:500;color:#1B1D2B;
  background:radial-gradient(120% 140% at 85% 20%,#F4C9F0 0%,rgba(244,201,240,0) 45%),radial-gradient(90% 120% at 10% 90%,#C9D8FF 0%,rgba(201,216,255,0) 50%),linear-gradient(180deg,#FFFFFF,#E9E6F2);
  box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 -10px 30px -12px rgba(170,120,255,.55),0 12px 40px -10px rgba(220,160,255,.35);transition:transform .2s,box-shadow .2s}
.pearl:hover{transform:translateY(-1px);box-shadow:0 0 0 1px rgba(255,255,255,.6) inset,0 -10px 36px -10px rgba(170,120,255,.7),0 16px 50px -10px rgba(220,160,255,.45)}
.pearl .s{font-size:1.2em}
.pearl.sm{padding:11px 20px;font-size:15px;border-radius:14px}

/* hero */
.hero{position:relative;width:100vw;margin-left:calc(50% - 50vw);height:clamp(560px,84vh,760px);overflow:hidden;
  background:#000}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-in{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:9vh 16px 22px}
.hero h1{font-weight:400;font-size:clamp(38px,7.4vw,80px);line-height:1.02;letter-spacing:-.04em}
.hero h1 .s{font-size:1.02em;letter-spacing:-.02em}
.pill{margin-top:22px;position:relative;display:inline-block;padding:.08em .55em .16em;border-radius:.42em;border:1px solid rgba(255,255,255,.16);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015));box-shadow:0 0 60px -10px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.08);
  font-family:var(--sans);font-weight:300;font-size:clamp(48px,9vw,96px);line-height:1.08;letter-spacing:-.03em;color:#fff;
  text-shadow:0 0 18px rgba(255,255,255,.75),0 0 42px rgba(255,255,255,.35)}
.pill i{font-style:normal}
.pill::after{content:"";position:absolute;left:22%;right:22%;bottom:-14px;height:1.5px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);box-shadow:0 0 12px rgba(255,255,255,.6)}
.hero .lead{margin-top:34px;max-width:46ch;color:var(--text-2);font-size:16px}
.hero .lead .s{color:var(--text)}
.hero .cta{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:12px}
.hero .cta small{color:#E6E5DE;font-size:14px;padding:4px 12px;border-radius:999px;background:rgba(6,8,8,.55);backdrop-filter:blur(6px);text-shadow:0 1px 8px #000,0 0 18px #000}
.hero .foot{text-shadow:0 1px 8px #000}
.hero .foot{display:flex;justify-content:space-between;width:100%;max-width:1040px;margin-top:34px;font-size:13px;color:rgba(255,255,255,.4)}
.hero .foot>span:nth-child(2){color:rgba(255,255,255,.7)}
@media (max-width:560px){.hero .foot>span:first-child,.hero .foot>span:last-child{display:none}.hero .foot{justify-content:center}}

/* stats strip */
.strip{display:flex;flex-wrap:wrap;gap:12px 40px;align-items:flex-end;justify-content:space-between;padding:26px 0 30px;border-bottom:1px solid var(--line)}
.stat b{display:block;font-weight:300;font-size:40px;letter-spacing:-.04em;line-height:1}
.stat span{font-size:13px;color:var(--text-2)}
.ladder{flex:1 1 280px;max-width:420px}
.ladder .bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--glass-2);margin:8px 0}
.ladder .bar span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text-2)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}

/* units */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin:52px 0 20px}
.sec-h h2{font-size:clamp(28px,4vw,40px);letter-spacing:-.035em;font-weight:400}
.sec-h h2 .s{font-size:1.12em}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.units{grid-template-columns:1fr}}
.unit{border:1px solid var(--line);border-radius:20px;padding:20px 20px 10px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01))}
.unit-h{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.unit-h .no{font-family:var(--sans);font-weight:300;font-size:30px;line-height:1;color:var(--text-3);min-width:1.1em}
.unit-h h3{font-size:19px;letter-spacing:-.02em}
.unit-h small{display:block;color:var(--text-3);font-size:12px;letter-spacing:.04em}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.lesson button.name{background:none;border:0;padding:0;text-align:left;font-size:15px;color:var(--text)}
.lesson button.name:hover{color:#fff;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}
.lesson .acts{display:flex;gap:6px}
.lesson .meter{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-3)}
.meter .track{flex:1;height:3px;border-radius:2px;background:var(--glass-2);overflow:hidden;display:flex}
.meter .track i{display:block;height:100%}
.due-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ember);box-shadow:0 0 8px var(--ember);margin-right:6px;vertical-align:1px}

/* entry card */
.glass{border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.hw{font-size:clamp(34px,6vw,52px);font-weight:400;letter-spacing:-.04em;line-height:1.05;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.meta{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;margin-top:8px;color:var(--text-2);font-size:14px}
.meta .pos{font-family:var(--serif);font-size:17px}
.tr{font-size:21px;margin-top:14px;letter-spacing:-.01em}
.expl{color:var(--text-2);margin-top:6px;max-width:60ch}
.def{font-family:var(--read);font-size:21px;line-height:1.35;margin-top:14px;max-width:44ch}
.ex{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:12px}
.ex li{padding-left:14px;border-left:1px solid var(--line-2)}
.ex .en{font-family:var(--read);font-size:19px;line-height:1.35}
.ex .ru{font-size:13px;color:var(--text-3);margin-top:2px}
mark{background:none;color:#fff;text-shadow:0 0 12px rgba(255,255,255,.55);border-bottom:1px solid rgba(233,169,75,.8)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text-2)}
.chip.syn{border-style:dashed}
.say{border:1px solid var(--line);background:var(--glass);border-radius:50%;width:38px;height:38px;display:inline-grid;place-items:center;color:var(--text-2);flex:none}
.say:hover{color:#fff;border-color:var(--line-2)}
.say svg{width:16px;height:16px}

/* lesson page / list */
.back{background:none;border:0;color:var(--text-2);padding:0;font-size:14px}
.back:hover{color:var(--text)}
.page-h{margin:26px 0 22px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-end}
.page-h h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.04em;font-weight:400;line-height:1.05}
.page-h h1 .s{font-size:1.1em}
.list{border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) auto;gap:14px;align-items:center;padding:13px 4px;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:transparent}
.item:hover{background:var(--glass)}
.item .w{font-size:17px;letter-spacing:-.01em}
.item .w small{font-family:var(--serif);color:var(--text-3);margin-left:8px;font-size:15px}
.item .t{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .u{font-size:12px;color:var(--text-3)}
.pips{display:flex;gap:4px}
.pips i{width:6px;height:6px;border-radius:50%;background:var(--glass-2)}
.pips i.on{background:var(--text-2)}
.pips.m i.on{background:var(--moss);box-shadow:0 0 6px var(--moss)}
@media (max-width:560px){.item{grid-template-columns:1fr auto}.item .t{grid-column:1/-1;grid-row:2;white-space:normal}}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.field{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:9px 16px;color-scheme:dark}
.field option{background:var(--night-2)}
.tools .field:first-child{flex:1;min-width:200px}
.empty{padding:40px;text-align:center;color:var(--text-2)}

/* segmented */
.seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--glass)}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;color:var(--text-2);font-size:13.5px}
.seg button[aria-pressed="true"]{background:#F1F0EA;color:#111}

/* session + cards */
.stage{max-width:700px;margin:0 auto;padding-top:20px}
.prog{display:flex;align-items:center;gap:14px;margin-bottom:22px;font-size:13px;color:var(--text-2)}
.prog .track{flex:1;height:2px;background:var(--glass-2);border-radius:1px;overflow:hidden}
.prog .track i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#fff);box-shadow:0 0 10px #fff;transition:width .3s}
.task{padding:28px}
@media (max-width:520px){.task{padding:20px}}
.task .kind{display:flex;justify-content:space-between;gap:10px;margin-bottom:18px}
.prompt{font-size:clamp(32px,6vw,48px);letter-spacing:-.04em;line-height:1.05}
.prompt.ru{font-size:clamp(22px,4vw,30px);letter-spacing:-.02em}
.sentence{font-family:var(--read);font-size:clamp(22px,3.6vw,28px);line-height:1.3}
.gap{display:inline-block;min-width:4.5em;border-bottom:1px solid #fff;box-shadow:0 6px 10px -8px #fff;text-align:center;color:var(--text-3)}
.hint{margin-top:10px;font-size:14px;color:var(--text-2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:13px 16px;display:flex;gap:12px;align-items:baseline;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--line-2);background:var(--glass-2)}
.opt kbd{font-family:var(--sans);font-size:11px;color:var(--text-3);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.opt.right{border-color:var(--moss);background:var(--moss-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.answer{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.answer input,.answer textarea{flex:1;min-width:0;border:1px solid var(--line);background:rgba(0,0,0,.35);border-radius:14px;padding:13px 16px;font-size:18px}
.answer textarea{min-height:100px;resize:vertical;font-family:var(--read);font-size:20px;width:100%}
.answer input:focus,.answer textarea:focus{border-color:var(--line-2);outline:none;box-shadow:0 0 24px -8px rgba(255,255,255,.3)}
.fb{margin-top:20px;border-radius:16px;padding:16px 18px;border:1px solid}
.fb.good{background:var(--moss-bg);border-color:rgba(143,195,154,.3)}
.fb.bad{background:var(--bad-bg);border-color:rgba(231,136,122,.3)}
.fb .v{font-weight:500}
.fb.good .v b{color:var(--moss)} .fb.bad .v b{color:var(--bad)}
.next{margin-top:18px;display:flex;justify-content:flex-end;gap:12px;align-items:center;flex-wrap:wrap}
.done{text-align:center;padding:44px 20px}
.done h2{font-size:clamp(30px,5vw,44px);letter-spacing:-.04em;font-weight:400}
.kbd{font-size:11px;opacity:.6;margin-left:6px}

.flash{perspective:2200px;margin-top:4px}
.card{position:relative;min-height:0;border-radius:26px;padding:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 30px 80px -30px rgba(0,0,0,.9);
  background:radial-gradient(70% 60% at 50% 60%,rgba(76,154,160,.14),transparent 70%),linear-gradient(180deg,#0E1112,#050606);
  transition:transform .22s cubic-bezier(.4,0,.6,1)}
.card.back{cursor:default;background:radial-gradient(80% 60% at 50% 0%,rgba(233,169,75,.08),transparent 70%),linear-gradient(180deg,#0F1111,#050606)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px circle at var(--x,50%) var(--y,30%),rgba(255,255,255,.07),transparent 70%)}
.card .side{position:absolute;top:18px;right:20px}
.card .word{font-size:clamp(44px,9vw,72px);font-weight:400;letter-spacing:-.045em;line-height:1;text-shadow:0 0 34px rgba(255,255,255,.22)}
.card .sub{margin-top:14px;display:flex;gap:12px;align-items:baseline;justify-content:center;color:var(--text-2);font-size:15px}
.card .sub .pos{font-family:var(--serif);}
.card .tap{position:absolute;bottom:20px;left:0;right:0;font-size:12px;color:var(--text-3)}
.card .answer-big{font-size:clamp(28px,5.4vw,42px);letter-spacing:-.03em;line-height:1.15;max-width:18ch}
.card .answer-def{font-family:var(--read);font-size:clamp(24px,4.4vw,32px);line-height:1.3;max-width:24ch}
.card .note{margin-top:14px;color:var(--text-2);font-size:16px;max-width:44ch}
.card .cols{list-style:none;margin:30px 0 0;padding:0;display:grid;gap:10px;justify-items:center}
.card .cols li{display:flex;flex-direction:column;align-items:center;gap:1px}
.card .cols .cc{font-size:17px;color:var(--text)}
.card .cols .cr{font-size:13px;color:var(--text-3)}
.card .answer-big{text-wrap:balance}
.card .ex-line{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);max-width:52ch;font-family:var(--read);font-size:17px;line-height:1.45;color:var(--text)}
.card .ex-line small{display:block;font-family:var(--sans);font-size:13px;color:var(--text-3);margin-top:4px}
.tiltw{transform-style:preserve-3d;transition:transform .3s ease-out}
.flipper{position:relative;min-height:500px;transform-style:preserve-3d;transition:transform .78s cubic-bezier(.45,.05,.2,1);cursor:pointer}
.flipper .card{position:absolute;inset:0 0 auto 0;min-height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:none}
.flipper .card.back{transform:rotateY(180deg)}
.flipper[data-side="front"] .card.back,.flipper[data-side="back"] .card.front{visibility:hidden}
.flipper.flipping{animation:lift .78s cubic-bezier(.45,.05,.2,1)}
@keyframes lift{0%{scale:1}50%{scale:1.06;translate:0 -14px}100%{scale:1}}
.flipper.flipping .card{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 60px 120px -30px rgba(0,0,0,1),0 0 80px -20px rgba(160,230,210,.25)}
.card .shine{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:linear-gradient(calc(90deg + var(--dir,1)*20deg),transparent 30%,rgba(255,255,255,.16) 48%,rgba(255,255,255,.04) 55%,transparent 70%);background-size:250% 100%}
.flipper.flipping .card .shine{animation:shineMove .78s ease-in-out}
@keyframes shineMove{0%{opacity:0;background-position:120% 0}40%{opacity:1}100%{opacity:0;background-position:-20% 0}}
@media (max-width:520px){.card{padding:26px 20px;min-height:360px}}
.card-acts{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}

dialog{border:0;padding:0;background:transparent;max-width:660px;width:calc(100% - 32px);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
dialog .glass{background:var(--night-2);max-height:86vh;overflow:auto;padding:28px}
.dactions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#F1F0EA;color:#111;padding:9px 18px;border-radius:999px;font-size:14px;z-index:9}
.spin{display:inline-block;width:14px;height:14px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
/* атмосфера */
@property --spin{syntax:"<angle>";inherits:false;initial-value:0deg}
#ambient,#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;display:block}
#ambient{z-index:0}
#fx{z-index:30}
.wrap{position:relative;z-index:1}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(380px circle at var(--mx,50%) var(--my,-20%),rgba(160,220,210,.035),transparent 70%)}
#view.enter{animation:viewIn .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewIn{from{opacity:.001;filter:blur(8px);transform:translateY(12px)}to{opacity:1;filter:none;transform:none}}
.hero h1 .ch{display:inline-block;animation:chIn 1s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*38ms)}
@keyframes chIn{from{opacity:.001;filter:blur(12px);transform:translateY(.25em)}to{opacity:1;filter:none;transform:none}}
.pill{animation:rise .9s .5s cubic-bezier(.2,.7,.2,1) both,breathe 5s 1.4s ease-in-out infinite}
@keyframes breathe{0%,100%{text-shadow:0 0 18px rgba(255,255,255,.75),0 0 42px rgba(255,255,255,.35);box-shadow:0 0 60px -10px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.08)}
  50%{text-shadow:0 0 24px rgba(255,255,255,.95),0 0 70px rgba(200,255,240,.5);box-shadow:0 0 90px -6px rgba(200,255,240,.26),inset 0 1px 0 rgba(255,255,255,.14)}}
.pill::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);background-size:250% 100%;animation:sweep 6s 1.6s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%{background-position:130% 0}45%,100%{background-position:-30% 0}}
.pill::after{animation:lineGlow 5s 1.4s ease-in-out infinite}
@keyframes lineGlow{50%{left:12%;right:12%;box-shadow:0 0 20px rgba(255,255,255,.9)}}
.hero .lead{animation-delay:.9s}
.hero .cta{animation:rise 1s 1.1s cubic-bezier(.2,.7,.2,1) both}
.hero .foot{animation:rise 1s 1.3s both}
.pearl{isolation:isolate;overflow:hidden}
.pearl::before{content:"";position:absolute;inset:-60%;z-index:-1;background:conic-gradient(from var(--spin),rgba(255,190,240,.0),rgba(255,190,240,.55),rgba(170,200,255,.55),rgba(190,255,230,.45),rgba(255,190,240,.0));filter:blur(16px);animation:spin 7s linear infinite;opacity:.8}
.pearl::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.35))}
@keyframes spin{to{--spin:360deg}}
.pearl:active{transform:scale(.97)}
.unit{position:relative;animation:rise .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*70ms);transition:border-color .3s,transform .3s}
.unit::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(300px circle at var(--x,50%) var(--y,50%),rgba(170,230,210,.09),transparent 70%)}
.unit:hover{border-color:var(--line-2)}
.unit:hover::before{opacity:1}
.unit:hover .no{color:#fff;text-shadow:0 0 16px rgba(255,255,255,.6)}
.unit-h .no{transition:color .3s,text-shadow .3s}
.meter .track i{animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.due-dot{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 14px 2px var(--ember);opacity:.7}}
.prog .track{position:relative;overflow:visible}
.prog .track i{position:relative;border-radius:2px}
.prog .track i::after{content:"";position:absolute;right:-3px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(200,255,240,.8)}
.task{animation:cardIn .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes cardIn{from{opacity:.001;transform:translateY(16px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.task.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.task.win{box-shadow:0 0 60px -12px rgba(143,195,154,.45),inset 0 1px 0 rgba(255,255,255,.05);border-color:rgba(143,195,154,.35);transition:box-shadow .4s,border-color .4s}
.fb{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.fb .ex li{animation:rise .5s both}.fb .ex li:nth-child(2){animation-delay:.12s}
.opt{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
.opt.right{animation:glowGood .8s both}
@keyframes glowGood{40%{box-shadow:0 0 30px -4px rgba(143,195,154,.7)}}
.ex li{transition:border-color .3s}.ex li:hover{border-left-color:var(--ember)}
mark{animation:markIn 1.2s .3s both}
@keyframes markIn{from{border-bottom-color:transparent;text-shadow:none}}
.tilt{transition:transform .25s ease-out;transform-style:preserve-3d}
.flash{animation:cardIn .45s cubic-bezier(.2,.7,.2,1) both}
.flash.noanim{animation:none}
.flash.out-r{animation:outR .38s cubic-bezier(.5,0,.7,.4) forwards}
.flash.out-l{animation:outL .38s cubic-bezier(.5,0,.7,.4) forwards}
@keyframes outR{to{opacity:0;transform:translateX(90px) rotate(6deg);filter:blur(4px)}}
@keyframes outL{to{opacity:0;transform:translateX(-90px) rotate(-6deg);filter:blur(4px)}}
@keyframes breatheTxt{50%{text-shadow:0 0 44px rgba(200,255,240,.45)}}
.done h2{text-shadow:0 0 30px rgba(255,255,255,.35)}
.item{transition:background .2s,padding-left .25s}
.item:hover{padding-left:12px}
.item:hover .w{text-shadow:0 0 14px rgba(255,255,255,.4)}
dialog[open] .glass{animation:cardIn .4s cubic-bezier(.2,.7,.2,1) both}
.seg button{transition:background .25s,color .25s}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero .lead{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

имизировать воздействие"},{"c":"minimize costs","ru":"сократить расходы"},{"c":"minimize water loss","ru":"сократить потерю воды"},{"c":"minimize damage","ru":"свести к минимуму ущерб"}],"syn":["reduce","cut down"]},{"id":"moisture-3","w":"moisture","lesson":3,"pos":"noun","ipa":"ˈmɔɪstʃə","tr":"влага, влажность","expl":"Небольшое количество воды в воздухе, почве или на поверхности; неисчисляемое.","def":"small amounts of water in the air, soil or on a surface","ex":[{"en":"Deep roots allow the plant to reach moisture far below the sand.","ru":"Глубокие корни позволяют растению добираться до влаги глубоко под песком.","f":"moisture"},{"en":"This cream helps your skin keep its moisture in winter.","ru":"Этот крем помогает коже сохранять влагу зимой.","f":"moisture"},{"en":"Wooden furniture can crack if the room has too little moisture.","ru":"Деревянная мебель может треснуть, если в комнате слишком мало влаги.","f":"moisture"}],"col":["retain moisture","soil moisture","absorb moisture","moisture loss","moisture content"],"cols":[{"c":"retain moisture","ru":"удерживать влагу"},{"c":"soil moisture","ru":"влажность почвы"},{"c":"absorb moisture","ru":"впитывать влагу"},{"c":"moisture loss","ru":"потеря влаги"},{"c":"moisture content","ru":"содержание влаги"}],"syn":["dampness","humidity"]},{"id":"occupy-3","w":"occupy","lesson":3,"pos":"verb","ipa":"ˈɒkjupaɪ","tr":"занимать, заселять","expl":"Занимать пространство, место или время; в экологии — заселять территорию.","def":"to fill or use a space, area or period of time","ex":[{"en":"Hardy shrubs occupy the dry areas where trees cannot grow.","ru":"Выносливые кустарники занимают сухие участки, где не растут деревья.","f":"occupy"},{"en":"All the seats on the morning train were already occupied.","ru":"Все места в утреннем поезде уже были заняты.","f":"occupied"},{"en":"Playing chess keeps my grandfather's mind occupied for hours.","ru":"Шахматы часами занимают ум моего дедушки.","f":"occupied"}],"col":["occupy an area"," ɪmeɪt","tr":"оценивать, подсчитывать приблизительно","expl":"Примерно рассчитать число или стоимость; частая конструкция: It is estimated that...","def":"to guess a number or amount using available information","ex":[{"en":"Experts estimate that the country will need 50,000 more nurses by 2030.","ru":"Эксперты подсчитали, что к 2030 году стране понадобится ещё 50 000 медсестёр.","f":"estimate"},{"en":"It is estimated that a third of the city's food is wasted.","ru":"По оценкам, треть еды в городе выбрасывается.","f":"estimated"},{"en":"Can you estimate how long the project will take?","ru":"Можете примерно оценить, сколько времени займёт проект?","f":"estimate"}],"col":["it is estimated that","estimate the cost","roughly estimate","estimate the number","conservatively estimated"],"cols":[{"c":"it is estimated that","ru":"по оценкам"},{"c":"estimate the cost","ru":"оценить стоимость"},{"c":"roughly estimate","ru":"приблизительно подсчитать"},{"c":"estimate the number","ru":"подсчитать количество"},{"c":"conservatively estimated","ru":"по скромным оценкам"}],"syn":["calculate","assess"]},{"id":"lure-13","w":"lure","lesson":13,"pos":"verb","ipa":"lʊə","tr":"заманивать, привлекать","expl":"Привлекать чем-то выгодным, часто с оттенком соблазна: lure someone away/with higher pay.","def":"to attract someone by offering something attractive","ex":[{"en":"Rich countries lure nurses away with higher wages and better conditions.","ru":"Богатые страны переманивают медсестёр высокими зарплатами и лучшими условиями.","f":"lure"},{"en":"The startup lured top engineers with generous share options.","ru":"Стартап заманил лучших инженеров щедрыми опционами на акции.","f":"lured"},{"en":"Cheap flights lure thousands of tourists to the island every summer.","ru":"Дешёвые авиабилеты каждое лето привлекают на остров тысячи туристов.","f":"lure"}],"col":["lure customers","lure tourists","lure someone away","lured by high salaries","lure into a trap"],"cols":[{"c":"lure customers","ru":"пр modations"},{"en":"It's hard to find cheap accommodations in the city during the festival.","ru":"Во время фестиваля в городе трудно найти дешёвое жильё.","f":"accommodations"}],"col":["hotel accommodations","find accommodations","luxury accommodations","affordable accommodations","book accommodations"],"cols":[{"c":"hotel accommodations","ru":"гостиничное размещение"},{"c":"find accommodations","ru":"найти жильё"},{"c":"luxury accommodations","ru":"роскошное жильё"},{"c":"affordable accommodations","ru":"доступное жильё"},{"c":"book accommodations","ru":"забронировать жильё"}],"syn":["lodging","housing"]},{"id":"avoid-17","w":"avoid","lesson":17,"pos":"verb","ipa":"əˈvɔɪd","tr":"избегать, уклоняться","expl":"Стараться не делать что-то или держаться подальше; после avoid идёт глагол с -ing.","def":"to stay away from something or try not to do it","ex":[{"en":"Ecotourists try to avoid places that harm local wildlife.","ru":"Экотуристы стараются избегать мест, которые вредят местной дикой природе.","f":"avoid"},{"en":"Leave early if you want to avoid the morning traffic.","ru":"Выезжайте рано, если хотите избежать утренних пробок.","f":"avoid"},{"en":"She avoided eating sugar for a month to improve her health.","ru":"Она месяц избегала сахара, чтобы улучшить здоровье.","f":"avoided"}],"col":["avoid mistakes","avoid the crowds","avoid contact","try to avoid","narrowly avoid"],"cols":[{"c":"avoid mistakes","ru":"избегать ошибок"},{"c":"avoid the crowds","ru":"избегать толп"},{"c":"avoid contact","ru":"избегать контакта"},{"c":"try to avoid","ru":"стараться избегать"},{"c":"narrowly avoid","ru":"едва избежать"}],"syn":["steer clear of","evade"]},{"id":"barrier-17","w":"barrier","lesson":17,"pos":"noun","ipa":"ˈbæriə","tr":"барьер, преграда, препятствие","expl":"Физическая преграда или то, что мешает чего-то достичь.","def":"something that blocks the way or makes something difficult","ex":[{"en":"The coral reef acts as a natural barrier against storms.","ru":"Коралловый р ists are projecting slower growth for the coming months.","ru":"Экономисты прогнозируют замедление роста в ближайшие месяцы.","f":"projecting"}],"col":["projected growth","projected figures","be projected to rise","projected costs","project future sales"],"cols":[{"c":"projected growth","ru":"прогнозируемый рост"},{"c":"projected figures","ru":"прогнозные показатели"},{"c":"be projected to rise","ru":"по прогнозам, вырасти"},{"c":"projected costs","ru":"прогнозируемые затраты"},{"c":"project future sales","ru":"прогнозировать будущие продажи"}],"syn":["forecast","predict"]},{"id":"reputation-19","w":"reputation","lesson":19,"pos":"noun","ipa":"ˌrepjuˈteɪʃn","tr":"репутация","expl":"Мнение людей о ком-то или о чём-то, сложившееся со временем.","def":"the opinion that people have about someone or something","ex":[{"en":"The restaurant built its reputation on fresh local ingredients.","ru":"Ресторан построил свою репутацию на свежих местных продуктах.","f":"reputation"},{"en":"One bad review can seriously damage a small firm's reputation.","ru":"Один плохой отзыв может серьёзно навредить репутации небольшой фирмы.","f":"reputation"},{"en":"The university has an excellent reputation for engineering.","ru":"У университета отличная репутация в области инженерии.","f":"reputation"}],"col":["a good reputation","build a reputation","damage someone's reputation","earn a reputation","a reputation for quality"],"cols":[{"c":"a good reputation","ru":"хорошая репутация"},{"c":"build a reputation","ru":"создавать репутацию"},{"c":"damage someone's reputation","ru":"повредить чьей-либо репутации"},{"c":"earn a reputation","ru":"заслужить репутацию"},{"c":"a reputation for quality","ru":"репутация за качество"}],"syn":["name","standing"]},{"id":"sound-19","w":"sound","lesson":19,"pos":"adj","ipa":"saʊnd","tr":"надёжный, разумный, прочный","expl":"О плане, решении или финансах: хорошо продуманный и надёжный; не путать с «звук».","def":"sensible, reliable and likely to succeed","ex":[  signal failure.","ru":"Поезд отменили, по-видимому, из-за неисправности сигнала.","f":"apparently"},{"en":"He was apparently unaware that his post had gone viral.","ru":"Он, похоже, не знал, что его пост стал вирусным.","f":"apparently"}],"col":["apparently unaware","apparently simple","apparently not","apparently unrelated","apparently harmless"],"cols":[{"c":"apparently unaware","ru":"по-видимому, не знающий"},{"c":"apparently simple","ru":"на первый взгляд простой"},{"c":"apparently not","ru":"видимо, нет"},{"c":"apparently unrelated","ru":"на первый взгляд не связанный"},{"c":"apparently harmless","ru":"по-видимому, безобидный"}],"syn":["seemingly","evidently"]},{"id":"carry-out-22","w":"carry out","lesson":22,"pos":"phrasal verb","ipa":"ˌkæri ˈaʊt","tr":"проводить, выполнять, осуществлять","expl":"Выполнять работу, исследование, опрос или план; частое сочетание в IELTS.","def":"to do or complete a task, study or plan","ex":[{"en":"Researchers carried out a survey of two thousand social media users.","ru":"Исследователи провели опрос среди двух тысяч пользователей соцсетей.","f":"carried out"},{"en":"The council plans to carry out repairs on the bridge next month.","ru":"Городской совет планирует провести ремонт моста в следующем месяце.","f":"carry out"},{"en":"Students must carry out the experiment carefully and record every result.","ru":"Студенты должны аккуратно провести эксперимент и записать каждый результат.","f":"carry out"}],"col":["carry out research","carry out a survey","carry out a study","carry out a plan","carry out tasks"],"cols":[{"c":"carry out research","ru":"проводить исследование"},{"c":"carry out a survey","ru":"проводить опрос"},{"c":"carry out a study","ru":"проводить исследование"},{"c":"carry out a plan","ru":"осуществить план"},{"c":"carry out tasks","ru":"выполнять задачи"}],"syn":["conduct","perform"]},{"id":"community-22","w":"community","lesson":22,"pos":"noun","ipa":"kəˈmjuːnəti","tr":"сообщество, община, местные жители","expl":  about slippery roads after the storm.","ru":"Водителей предупредили о скользких дорогах после бури.","f":"slippery"},{"en":"The path down to the beach was steep and slippery.","ru":"Тропинка к пляжу была крутой и скользкой.","f":"slippery"}],"col":["slippery surfaces","a slippery floor","slippery when wet","slippery roads","become slippery"],"cols":[{"c":"slippery surfaces","ru":"скользкие поверхности"},{"c":"a slippery floor","ru":"скользкий пол"},{"c":"slippery when wet","ru":"скользкий, когда мокрый"},{"c":"slippery roads","ru":"скользкие дороги"},{"c":"become slippery","ru":"становиться скользким"}],"syn":["slick","icy"]},{"id":"slope-24","w":"slope","lesson":24,"pos":"noun","ipa":"sləʊp","tr":"склон, уклон","expl":"Поверхность, у которой один конец выше другого.","def":"a surface that is higher at one end than the other","ex":[{"en":"A gentle slope is much easier to manage than stairs.","ru":"Пологий уклон преодолевать гораздо легче, чем лестницу.","f":"slope"},{"en":"We skied down the slope before the lifts closed.","ru":"Мы спустились на лыжах по склону до закрытия подъёмников.","f":"slope"},{"en":"The village is built on a steep slope above the river.","ru":"Деревня построена на крутом склоне над рекой.","f":"slope"}],"col":["a steep slope","a gentle slope","a slight slope","down the slope","slope of"],"cols":[{"c":"a steep slope","ru":"крутой склон"},{"c":"a gentle slope","ru":"пологий склон"},{"c":"a slight slope","ru":"небольшой уклон"},{"c":"down the slope","ru":"вниз по склону"},{"c":"slope of","ru":"уклон (чего-либо)"}],"syn":["incline","gradient"]},{"id":"switch-24","w":"switch","lesson":24,"pos":"noun","ipa":"swɪtʃ","tr":"выключатель, переключатель","expl":"Кнопка или рычаг для включения и выключения прибора, например света.","def":"a small device that turns electricity on or off","ex":[{"en":"Light switches should be low enough for wheelchair users to reach.","ru":"Выключатели должны быть достаточно низко, чтобы до них дотягивались люди на колясках.","f":"switches"},{"en":"I couldn't find the switch in the dark hotel room.","ru":"Я не смог найти выключатель в тёмном гостиничном номере.","f":"switch"},{"en":"Press the switch on the side to turn the fan on.","ru":"Нажмите переключатель сбоку, чтобы включить вентилятор.","f":"switch"}],"col":["a light switch","flick a switch","press a switch","an on/off switch","a wall switch"],"cols":[{"c":"a light switch","ru":"выключатель света"},{"c":"flick a switch","ru":"щёлкнуть выключателем"},{"c":"press a switch","ru":"нажать на выключатель"},{"c":"an on/off switch","ru":"кнопка включения/выключения"},{"c":"a wall switch","ru":"настенный выключатель"}],"syn":["button","control"]},{"id":"terrain-24","w":"terrain","lesson":24,"pos":"noun","ipa":"təˈreɪn","tr":"местность, рельеф","expl":"Участок земли с точки зрения его поверхности: ровный, горный, каменистый.","def":"an area of land and its physical features","ex":[{"en":"Rough terrain makes hiking trails difficult for wheelchair users.","ru":"Пересечённая местность делает туристические тропы трудными для людей на колясках.","f":"terrain"},{"en":"The new electric bike handles mountain terrain with ease.","ru":"Новый электровелосипед легко справляется с горной местностью.","f":"terrain"},{"en":"Rescue teams struggled to cross the muddy terrain.","ru":"Спасатели с трудом преодолевали грязную местность.","f":"terrain"}],"col":["rough terrain","difficult terrain","uneven terrain","mountainous terrain","hilly terrain"],"cols":[{"c":"rough terrain","ru":"пересечённая местность"},{"c":"difficult terrain","ru":"труднопроходимая местность"},{"c":"uneven terrain","ru":"неровная местность"},{"c":"mountainous terrain","ru":"горная местность"},{"c":"hilly terrain","ru":"холмистая местность"}],"syn":["landscape","ground"]},{"id":"unwieldy-24","w":"unwieldy","lesson":24,"pos":"adj","ipa":"ʌnˈwiːldi","tr":"громоздкий, неуклюжий, неудобный","expl":"Большой или тяжёлый, поэтому неудобный в использовании; также о сложных системах.","def":"difficult to move or use because it is big or heavy","ex":[{"en":"Older wheelchairs were heavy and unwieldy on public transport.","ru":"Старые инвалидные коляски были тяжёлыми и громоздкими в общественном транспорте.","f":"unwieldy"},{"en":"Carrying an unwieldy suitcase up the stairs was exhausting.","ru":"Тащить громоздкий чемодан по лестнице было изнурительно.","f":"unwieldy"},{"en":"The old booking system was slow and unwieldy.","ru":"Старая система бронирования была медленной и неудобной.","f":"unwieldy"}],"col":["unwieldy equipment","an unwieldy system","unwieldy furniture","large and unwieldy","become unwieldy"],"cols":[{"c":"unwieldy equipment","ru":"громоздкое оборудование"},{"c":"an unwieldy system","ru":"громоздкая система"},{"c":"unwieldy furniture","ru":"громоздкая мебель"},{"c":"large and unwieldy","ru":"большой и неудобный"},{"c":"become unwieldy","ru":"стать громоздким"}],"syn":["cumbersome","awkward"]},{"id":"update-24","w":"update","lesson":24,"pos":"verb","ipa":"ʌpˈdeɪt","tr":"обновлять, модернизировать","expl":"Сделать что-то более современным или добавить новейшую информацию.","def":"to make something more modern or add the latest information","ex":[{"en":"The museum updated its entrances to meet accessibility standards.","ru":"Музей модернизировал входы в соответствии со стандартами доступности.","f":"updated"},{"en":"Remember to update your apps to fix security problems.","ru":"Не забывайте обновлять приложения, чтобы устранять проблемы безопасности.","f":"update"},{"en":"The council will update the bus timetable next week.","ru":"Городской совет обновит расписание автобусов на следующей неделе.","f":"update"}],"col":["update information","update the system","regularly update","update facilities","fully updated"],"cols":[{"c":"update information","ru":"обновлять информацию"},{"c":"update the system","ru":"обновлять систему"},{"c":"regularly update","ru":"регулярно обновлять"},{"c":"update facilities","ru":"модернизировать помещения"},{"c":"fully updated","ru":"полностью обновлённый"}],"syn":["modernize","renovate"]},{"id":"approach-25","w":"approach","lesson":25,"pos":"noun","ipa":"əˈprəʊtʃ","tr":"подход, метод","expl":"Способ решения задачи или работы с чем-то; часто с предлогом to: approach to learning.","def":"a way of dealing with a task or problem","ex":[{"en":"Our teacher uses a hands-on approach to explain difficult grammar rules.","ru":"Наш учитель использует практический подход, чтобы объяснять сложные правила грамматики.","f":"approach"},{"en":"The city is trying a new approach to reducing traffic in the center.","ru":"Город пробует новый подход к сокращению пробок в центре.","f":"approach"},{"en":"Different approaches work for different students, so flexibility matters.","ru":"Разным студентам подходят разные подходы, поэтому важна гибкость.","f":"approaches"}],"col":["a new approach to","take an approach","adopt an approach","a different approach","a practical approach"],"cols":[{"c":"a new approach to","ru":"новый подход к"},{"c":"take an approach","ru":"применять подход"},{"c":"adopt an approach","ru":"принять подход"},{"c":"a different approach","ru":"другой подход"},{"c":"a practical approach","ru":"практический подход"}],"syn":["method","strategy"]},{"id":"auditory-25","w":"auditory","lesson":25,"pos":"adj","ipa":"ˈɔːdɪtri","tr":"слуховой","expl":"Связанный со слухом; auditory learners лучше усваивают информацию на слух.","def":"related to hearing or learning by listening","ex":[{"en":"Auditory learners often remember lectures better than written notes.","ru":"Аудиалы часто запоминают лекции лучше, чем письменные конспекты.","f":"Auditory"},{"en":"Podcasts are a great tool for students with an auditory learning style.","ru":"Подкасты — отличный инструмент для студентов со слуховым стилем обучения.","f":"auditory"},{"en":"Loud city noise can cause auditory stress over long periods.","ru":"Громкий городской шум со временем может вызывать слуховой стресс.","f":"auditory"}],"col":["auditory learner","auditory memory","auditory processing","auditory information","auditory skills"],"cols":[{"c":"auditory learner","ru":"аудиал"},{"c":"auditory memory","ru":"слуховая память"},{"c":"auditory processing","ru":"слуховое восприятие"},{"c":"auditory information","ru":"слуховая информация"},{"c":"auditory skills","ru":"навыки восприятия на слух"}],"syn":["aural","acoustic"]},{"id":"blend-25","w":"blend","lesson":25,"pos":"noun","ipa":"blend","tr":"сочетание, смесь","expl":"Удачное сочетание разных элементов; blend of methods — смешение подходов.","def":"a mixture of different things that work well together","ex":[{"en":"The course offers a blend of online lessons and classroom workshops.","ru":"Курс предлагает сочетание онлайн-уроков и аудиторных практикумов.","f":"blend"},{"en":"Good teachers use a blend of visual and practical activities.","ru":"Хорошие учителя используют сочетание визуальных и практических заданий.","f":"blend"},{"en":"The café serves a blend of coffee beans from three countries.","ru":"Кафе подаёт смесь кофейных зёрен из трёх стран.","f":"blend"}],"col":["a blend of","a perfect blend","a unique blend","a healthy blend","an interesting blend"],"cols":[{"c":"a blend of","ru":"сочетание (чего-либо)"},{"c":"a perfect blend","ru":"идеальное сочетание"},{"c":"a unique blend","ru":"уникальное сочетание"},{"c":"a healthy blend","ru":"здоровое сочетание"},{"c":"an interesting blend","ru":"интересное сочетание"}],"syn":["mixture","combination"]},{"id":"circumstance-25","w":"circumstance","lesson":25,"pos":"noun","ipa":"ˈsɜːkəmstæns","tr":"обстоятельство, условия","expl":"Факт или условие, влияющее на ситуацию; чаще во мн. ч.: under the circumstances.","def":"a fact or condition that affects a situation","ex":[{"en":"Students learn differently depending on their personal circumstances.","ru":"Студенты учатся по-разному в зависимости от личных обстоятельств.","f":"circumstances"},{"en":"Under no circumstances should you share your exam password.","ru":"Ни при каких обстоятельствах не сообщайте свой пароль от экзамена.","f":"circumstances"},{"en":"The flight was cancelled due to circumstances beyond the airline's control.","ru":"Рейс отменили из-за обстоятельств, не зависящих от авиакомпании.","f":"circumstances"}],"col":["under no circumstances","in these circumstances","due to circumstances","personal circumstances","exceptional circumstances"],"cols":[{"c":"under no circumstances","ru":"ни при каких обстоятельствах"},{"c":"in these circumstances","ru":"в этих обстоятельствах"},{"c":"due to circumstances","ru":"из-за обстоятельств"},{"c":"personal circumstances","ru":"личные обстоятельства"},{"c":"exceptional circumstances","ru":"исключительные обстоятельства"}],"syn":["situation","condition"]},{"id":"confidence-25","w":"confidence","lesson":25,"pos":"noun","ipa":"ˈkɒnfɪdəns","tr":"уверенность, доверие","expl":"Вера в свои силы или доверие к кому-то; self-confidence — уверенность в себе.","def":"a feeling that you can do something well","ex":[{"en":"Speaking clubs helped her gain confidence before the IELTS interview.","ru":"Разговорные клубы помогли ей обрести уверенность перед собеседованием IELTS.","f":"confidence"},{"en":"Praise from a teacher can boost a child's confidence enormously.","ru":"Похвала учителя может сильно повысить уверенность ребёнка.","f":"confidence"},{"en":"Public confidence in the new policy remains low, according to surveys.","ru":"По данным опросов, доверие общества к новой политике остаётся низким.","f":"confidence"}],"col":["gain confidence","lack of confidence","build confidence","lose confidence in","self-confidence"],"cols":[{"c":"gain confidence","ru":"обрести уверенность"},{"c":"lack of confidence","ru":"неуверенность в себе"},{"c":"build confidence","ru":"укреплять уверенность"},{"c":"lose confidence in","ru":"потерять доверие к"},{"c":"self-confidence","ru":"уверенность в себе"}],"syn":["self-assurance","belief"]},{"id":"conventional-25","w":"conventional","lesson":25,"pos":"adj","ipa":"kənˈvenʃənl","tr":"традиционный, общепринятый","expl":"Обычный, привычный, принятый большинством; не «конвенциональный» в бытовой речи.","def":"usual and traditional, not new or different","ex":[{"en":"Conventional classroom teaching doesn't suit every type of learner.","ru":"Традиционное обучение в классе подходит не каждому типу учащихся.","f":"Conventional"},{"en":"Electric cars are cheaper to run than conventional vehicles.","ru":"Электромобили дешевле в обслуживании, чем обычные машины.","f":"conventional"},{"en":"She chose a less conventional career path after graduating.","ru":"После выпуска она выбрала менее традиционный карьерный путь.","f":"conventional"}],"col":["conventional methods","conventional wisdom","conventional teaching","conventional classroom","conventional approach"],"cols":[{"c":"conventional methods","ru":"традиционные методы"},{"c":"conventional wisdom","ru":"общепринятое мнение"},{"c":"conventional teaching","ru":"традиционное преподавание"},{"c":"conventional classroom","ru":"обычный класс"},{"c":"conventional approach","ru":"традиционный подход"}],"syn":["traditional","standard"]},{"id":"diagram-25","w":"diagram","lesson":25,"pos":"noun","ipa":"ˈdaɪəɡræm","tr":"схема, диаграмма","expl":"Простой рисунок, показывающий устройство или процесс; в IELTS Task 1 часто описывают diagram.","def":"a simple drawing that shows how something works","ex":[{"en":"Visual learners understand processes faster when they see a diagram.","ru":"Визуалы быстрее понимают процессы, когда видят схему.","f":"diagram"},{"en":"The IELTS task asked us to describe a diagram of a recycling process.","ru":"В задании IELTS нужно было описать схему процесса переработки.","f":"diagram"},{"en":"The engineer drew a quick diagram to explain the wiring.","ru":"Инженер быстро нарисовал схему, чтобы объяснить проводку.","f":"diagram"}],"col":["draw a diagram","a simple diagram","a diagram of","as shown in the diagram","label a diagram"],"cols":[{"c":"draw a diagram","ru":"нарисовать схему"},{"c":"a simple diagram","ru":"простая схема"},{"c":"a diagram of","ru":"схема (чего-либо)"},{"c":"as shown in the diagram","ru":"как показано на схеме"},{"c":"label a diagram","ru":"подписать схему"}],"syn":["chart","sketch"]},{"id":"dominant-25","w":"dominant","lesson":25,"pos":"adj","ipa":"ˈdɒmɪnənt","tr":"преобладающий, доминирующий","expl":"Главный, самый сильный или заметный среди других; dominant learning style — основной стиль.","def":"most important, strong, or noticeable","ex":[{"en":"Most people have one dominant learning style, but they use others too.","ru":"У большинства людей есть один преобладающий стиль обучения, но они используют и другие.","f":"dominant"},{"en":"English has become the dominant language of international science.","ru":"Английский стал главным языком международной науки.","f":"dominant"},{"en":"The company holds a dominant position in the smartphone market.","ru":"Компания занимает доминирующее положение на рынке смартфонов.","f":"dominant"}],"col":["dominant role","dominant position","dominant learning style","dominant hand","become dominant"],"cols":[{"c":"dominant role","ru":"ведущая роль"},{"c":"dominant position","ru":"доминирующее положение"},{"c":"dominant learning style","ru":"преобладающий стиль обучения"},{"c":"dominant hand","ru":"ведущая рука"},{"c":"become dominant","ru":"стать преобладающим"}],"syn":["main","prevailing"]},{"id":"encouragement-25","w":"encouragement","lesson":25,"pos":"noun","ipa":"ɪnˈkʌrɪdʒmənt","tr":"поддержка, поощрение","expl":"Слова или действия, которые придают человеку смелость и желание продолжать.","def":"words or actions that give someone hope or confidence","ex":[{"en":"With a little encouragement, shy students often start participating in class.","ru":"При небольшой поддержке застенчивые студенты часто начинают участвовать в занятиях.","f":"encouragement"},{"en":"Thanks to my parents' encouragement, I applied to study abroad.","ru":"Благодаря поддержке родителей я подал заявку на учёбу за границей.","f":"encouragement"},{"en":"The coach shouted words of encouragement from the side of the track.","ru":"Тренер выкрикивал слова поддержки у края дорожки.","f":"encouragement"}],"col":["give encouragement","words of encouragement","need encouragement","constant encouragement","with the encouragement of"],"cols":[{"c":"give encouragement","ru":"подбадривать"},{"c":"words of encouragement","ru":"слова поддержки"},{"c":"need encouragement","ru":"нуждаться в поддержке"},{"c":"constant encouragement","ru":"постоянная поддержка"},{"c":"with the encouragement of","ru":"при поддержке"}],"syn":["support","motivation"]},{"id":"expose-25","w":"expose","lesson":25,"pos":"verb","ipa":"ɪkˈspəʊz","tr":"знакомить, подвергать (воздействию)","expl":"Дать человеку возможность столкнуться с чем-то новым: expose children to music, languages.","def":"to give someone the chance to experience something","ex":[{"en":"Travel exposes young people to new cultures and ways of thinking.","ru":"Путешествия знакомят молодёжь с новыми культурами и образом мыслей.","f":"exposes"},{"en":"Children who are exposed to two languages early often become bilingual.","ru":"Дети, которые рано сталкиваются с двумя языками, часто становятся билингвами.","f":"exposed"},{"en":"Workers should not be exposed to harmful chemicals without protection.","ru":"Работники не должны подвергаться воздействию вредных химикатов без защиты.","f":"exposed"}],"col":["expose children to","be exposed to","expose students to new ideas","widely exposed","expose someone to risk"],"cols":[{"c":"expose children to","ru":"знакомить детей с"},{"c":"be exposed to","ru":"подвергаться воздействию"},{"c":"expose students to new ideas","ru":"знакомить учащихся с новыми идеями"},{"c":"widely exposed","ru":"широко подверженный"},{"c":"expose someone to risk","ru":"подвергать кого-либо риску"}],"syn":["introduce","subject"]},{"id":"facial-25","w":"facial","lesson":25,"pos":"adj","ipa":"ˈfeɪʃl","tr":"лицевой, (выражение) лица","expl":"Относящийся к лицу; facial expression — выражение лица.","def":"related to the face","ex":[{"en":"Teachers can read students' facial expressions to see if they're confused.","ru":"Учителя могут понять по выражению лиц студентов, запутались ли они.","f":"facial"},{"en":"The phone uses facial recognition to unlock the screen.","ru":"Телефон использует распознавание лица для разблокировки экрана.","f":"facial"},{"en":"Actors rely on subtle facial movements to show emotion on camera.","ru":"Актёры передают эмоции на камеру через тонкие движения лица.","f":"facial"}],"col":["facial expression","facial features","facial recognition","facial hair","facial movements"],"cols":[{"c":"facial expression","ru":"выражение лица"},{"c":"facial features","ru":"черты лица"},{"c":"facial recognition","ru":"распознавание лиц"},{"c":"facial hair","ru":"растительность на лице"},{"c":"facial movements","ru":"движения лица"}],"syn":["face-related"]},{"id":"fidget-25","w":"fidget","lesson":25,"pos":"verb","ipa":"ˈfɪdʒɪt","tr":"ёрзать, вертеться","expl":"Беспокойно двигаться, не сидеть спокойно — от скуки или нервов.","def":"to keep moving your hands or body because you are bored or nervous","ex":[{"en":"Kinesthetic learners often fidget when they have to sit still for hours.","ru":"Кинестетики часто ёрзают, когда приходится часами сидеть неподвижно.","f":"fidget"},{"en":"He kept fidgeting with his pen during the job interview.","ru":"Во время собеседования он всё время вертел в руках ручку.","f":"fidgeting"},{"en":"The children fidgeted in their seats as the long speech continued.","ru":"Дети ёрзали на местах, пока длилась долгая речь.","f":"fidgeted"}],"col":["fidget in your seat","fidget with a pen","start to fidget","fidget nervously","stop fidgeting"],"cols":[{"c":"fidget in your seat","ru":"ёрзать на месте"},{"c":"fidget with a pen","ru":"вертеть в руках ручку"},{"c":"start to fidget","ru":"начать ёрзать"},{"c":"fidget nervously","ru":"нервно ёрзать"},{"c":"stop fidgetin ":"Surgeons train for years to manipulate tiny instruments precisely.","ru":"Хирурги годами учатся точно работать с крошечными инструментами.","f":"manipulate"},{"en":"The software lets users manipulate 3D models on screen.","ru":"Программа позволяет пользователям работать с 3D-моделями на экране.","f":"manipulate"}],"col":["manipulate objects","manipulate tools","easily manipulate","manipulate by hand","manipulate materials"],"cols":[{"c":"manipulate objects","ru":"работать с предметами"},{"c":"manipulate tools","ru":"обращаться с инструментами"},{"c":"easily manipulate","ru":"легко управлять"},{"c":"manipulate by hand","ru":"управлять вручную"},{"c":"manipulate materials","ru":"работать с материалами"}],"syn":["handle","operate"]},{"id":"obstruction-25","w":"obstruction","lesson":25,"pos":"noun","ipa":"əbˈstrʌkʃn","tr":"препятствие, помеха","expl":"То, что мешает движению или процессу; obstruction of the road — перекрытие дороги.","def":"something that blocks a path or stops progress","ex":[{"en":"Poor lighting can be an obstruction to effective learning.","ru":"Плохое освещение может мешать эффективному обучению.","f":"obstruction"},{"en":"Traffic stopped because of an obstruction on the highway.","ru":"Движение остановилось из-за препятствия на шоссе.","f":"obstruction"},{"en":"The politician was accused of obstruction during the investigation.","ru":"Политика обвинили в воспрепятствовании расследованию.","f":"obstruction"}],"col":["cause an obstruction","remove an obstruction","an obstruction to progress","airway obstruction","without obstruction"],"cols":[{"c":"cause an obstruction","ru":"создавать препятствие"},{"c":"remove an obstruction","ru":"устранить препятствие"},{"c":"an obstruction to progress","ru":"препятствие прогрессу"},{"c":"airway obstruction","ru":"непроходимость дыхательных путей"},{"c":"without obstruction","ru":"без помех"}],"syn":["obstacle","barrier"]},{"id":"recite-25","w":"recite","lesson":25,"pos":"verb","ipa":"rɪˈsaɪt","tr":"декламиров рофилактике болезней в сельской местности.","f":"critical"}],"col":["critical role","critical factor","critically important","critical moment","critical to success"],"cols":[{"c":"critical role","ru":"решающая роль"},{"c":"critical factor","ru":"решающий фактор"},{"c":"critically important","ru":"крайне важный"},{"c":"critical moment","ru":"критический момент"},{"c":"critical to success","ru":"решающий для успеха"}],"syn":["crucial","vital"]},{"id":"current-28","w":"current","lesson":28,"pos":"noun","ipa":"ˈkʌrənt","tr":"(электрический) ток, течение","expl":"Поток электричества по проводу или воды в реке; как прилагательное значит «текущий».","def":"a flow of electricity through a wire, or of water or air","ex":[{"en":"The engineer measured the current flowing through the thin carbon wire.","ru":"Инженер измерил ток, проходящий через тонкую угольную нить.","f":"current"},{"en":"Switch off the power before you touch anything that carries an electric current.","ru":"Отключите питание, прежде чем трогать что-либо под электрическим током.","f":"current"},{"en":"Swimmers were warned about the strong current near the rocks.","ru":"Пловцов предупредили о сильном течении возле скал.","f":"current"}],"col":["electric current","strong current","current flows","ocean current","air current"],"cols":[{"c":"electric current","ru":"электрический ток"},{"c":"strong current","ru":"сильное течение"},{"c":"current flows","ru":"ток течёт"},{"c":"ocean current","ru":"океанское течение"},{"c":"air current","ru":"поток воздуха"}],"syn":["flow","stream"]},{"id":"derive-28","w":"derive","lesson":28,"pos":"verb","ipa":"dɪˈraɪv","tr":"получать, извлекать, происходить (от)","expl":"Получать что-то из источника; derive from — «происходить от», часто о словах и идеях.","def":"to get something from a particular source","ex":[{"en":"Many modern medicines are derived from plants found in tropical forests.","ru":"Многие современные лекарства получают из растений тропических лесов.","f":"derived"},{"en":"Students derive a lot of confidence from practicing speaking with native speakers.","ru":"Студенты обретают много уверенности, практикуя речь с носителями языка.","f":"derive"},{"en":"The word 'electricity' derives from a Greek word for amber.","ru":"Слово «электричество» происходит от греческого слова, означающего янтарь.","f":"derives"}],"col":["derive from","derive pleasure from","derive benefit from","derive income from","be derived from"],"cols":[{"c":"derive from","ru":"происходить от, получать из"},{"c":"derive pleasure from","ru":"получать удовольствие от"},{"c":"derive benefit from","ru":"извлекать пользу из"},{"c":"derive income from","ru":"получать доход от"},{"c":"be derived from","ru":"быть полученным из"}],"syn":["obtain","originate"]},{"id":"device-28","w":"device","lesson":28,"pos":"noun","ipa":"dɪˈvaɪs","tr":"устройство, прибор","expl":"Предмет или машина для определённой задачи; часто о гаджетах и технике.","def":"a machine or tool made for a particular purpose","ex":[{"en":"Please turn off all electronic devices before the exam begins.","ru":"Пожалуйста, выключите все электронные устройства до начала экзамена.","f":"devices"},{"en":"The inventor showed a small device that could store electric power.","ru":"Изобретатель показал небольшой прибор, способный накапливать электроэнергию.","f":"device"},{"en":"This cheap device measures air quality in your home in real time.","ru":"Этот недорогой прибор измеряет качество воздуха в доме в реальном времени.","f":"device"}],"col":["electronic device","safety device","a device for","mobile device","invent a device"],"cols":[{"c":"electronic device","ru":"электронное устройство"},{"c":"safety device","ru":"предохранительное устройство"},{"c":"a device for","ru":"устройство для"},{"c":"mobile device","ru":"мобильное устройство"},{"c":"invent a device","ru":"изобрести устройство"}],"syn":["gadget","appliance"]},{"id":"entrepreneur-28","w":"entrepreneur","lesson":28,"pos":"noun","ipa":"ˌɒntrəprəˈnɜː","tr":"предприниматель","expl":"Человек, который создаёт свой бизнес и берёт на себя финансовый риск.","def":"a person who starts a business and takes financial risks","ex":[{"en":"The young entrepreneur opened her first café while she was still at university.","ru":"Молодая предпринимательница открыла своё первое кафе, ещё учась в университете.","f":"entrepreneur"},{"en":"Many successful entrepreneurs failed several times before their ideas worked.","ru":"Многие успешные предприниматели терпели неудачу несколько раз, прежде чем их идеи сработали.","f":"entrepreneurs"},{"en":"The government offers cheap loans to local entrepreneurs in rural regions.","ru":"Правительство предлагает дешёвые кредиты местным предпринимателям в сельских регионах.","f":"entrepreneurs"}],"col":["successful entrepreneur","young entrepreneur","aspiring entrepreneur","serial entrepreneur","tech entrepreneur"],"cols":[{"c":"successful entrepreneur","ru":"успешный предприниматель"},{"c":"young entrepreneur","ru":"молодой предприниматель"},{"c":"aspiring entrepreneur","ru":"начинающий предприниматель"},{"c":"serial entrepreneur","ru":"серийный предприниматель"},{"c":"tech entrepreneur","ru":"предприниматель в сфере технологий"}],"syn":["businessperson","founder"]},{"id":"file-28","w":"file","lesson":28,"pos":"verb","ipa":"faɪl","tr":"подавать (заявку, иск), регистрировать","expl":"Официально подавать документ: заявку на патент, иск в суд, жалобу.","def":"to officially send a document, e.g. a patent application or lawsuit","ex":[{"en":"The scientist filed a patent for her new battery design last spring.","ru":"Прошлой весной учёная подала заявку на патент своей новой конструкции батареи.","f":"filed"},{"en":"Several customers have filed complaints about the delayed flights.","ru":"Несколько клиентов подали жалобы на задержку рейсов.","f":"filed"},{"en":"The company plans to file a lawsuit against its former partner.","ru":"Компания планирует подать иск против своего бывшего партнёра.","f":"file"}],"col" const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

function plural(n,one,few,many){const a=n%10,b=n%100;return a===1&&b!==11?one:(a>=2&&a<=4&&(b<10||b>=20)?few:many);}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400);}

/* ---------- progress storage ---------- */
// progress/<lesson>  →  { p: { <wordId>: {b,d,r,x} } }
const store = {
  mode:"local", db:null, prog:{}, stats:{days:{}}, timers:{},
  get(id){ return this.prog[id] || {b:0,d:0,r:0,x:0}; },
  ls(k,d){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;} },
  lsw(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch{} },
  initLocal(){ this.prog=this.ls("szs-prog",{}); this.stats=this.ls("szs-stats",{days:{}}); },
  set(id, st){
    this.prog[id]=st;
    if(this.mode==="db"){
      const L = BYID.get(id).lesson;
      clearTimeout(this.timers[L]);
      this.timers[L]=setTimeout(()=>{
        const p={}; WORDS.filter(w=>w.lesson===L).forEach(w=>{ if(this.prog[w.id]) p[w.id]=this.prog[w.id]; });
        this.db.doc("progress/l"+L).set({p}).catch(e=>toast("Прогресс не сохранился — проверьте связь"));
      },600);
    } else this.lsw("szs-prog",this.prog);
  },
  bump(){
    const k=dayKey(Date.now()); this.stats.days[k]=(this.stats.days[k]||0)+1;
    const ks=Object.keys(this.stats.days).sort(); while(ks.length>90) delete this.stats.days[ks.shift()];
    if(this.mode==="db"){ clearTimeout(this.timers.s); this.timers.s=setTimeout(()=>this.db.doc("meta/stats").set(this.stats).catch(()=>{}),1500); }
    else this.lsw("szs-stats",this.stats);
  },
  reset(id){ this.set(id,{b:0,d:0,r:0,x:0}); }
};

/* ---------- sentence helpers ---------- */
function findForm(w,e){
  const s=e.en, lo=s.toLowerCase();
  if(e.f && s.includes(e.f)) { const i=s.indexOf(e.f); return [i,i+e.f.length]; }
  if(e.f && lo.includes(e.f.toLowerCase())) { const i=lo.indexOf(e.f.toLowerCase()); return [i,i+e.f.length]; }
  const base=w.w.toLowerCase().split(" ")[0], stem=base.length>4?base.replace(/(e|y)$/,""):base;
  const m=new RegExp("\\b"+stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[a-z]*","i").exec(s);
  return m?[m.index,m.index+m[0].length]:null;
}
function highlight(w,e){const r=findForm(w,e);if(!r)return esc(e.en);return esc(e.en.slice(0,r[0]))+"<mark>"+esc(e.en.slice(r[0],r[1]))+"</mark>"+esc(e.en.slice(r[1]));}
function gapped(w,e){const r=findForm(w,e);if(!r)return null;return{html:esc(e.en.slice(0,r[0]))+'<span class="gap">?</span>'+esc(e.en.slice(r[1])),form:e.en.slice(r[0],r[1])};}
const canSpeak="speechSynthesis" in window;
function speak(t){ if(!canSpeak)return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="en-GB"; u.rate=.9;
  const vs=speechSynthesis.getVoices(); const v=vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang)); if(v)u.voice=v; speechSynthesis.speak(u); }
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b){e.preventDefault();e.stopPropagation();speak(b.dataset.say);}},true);
const clean=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z' -]/g,"").replace(/\s+/g," ").trim();
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length];}
function checkTyped(v,targets){const a=clean(v);if(!a)return"empty";if(targets.some(t=>clean(t)===a))return"exact";if(targets.some(t=>clean(t).length>4&&lev(a,clean(t))<=1))return"close";return"wrong";}
const sayBtn=(w,sz)=>canSpeak?`<button class="say" data-say="${esc(w)}" aria-label="Произнести"${sz?` style="width:${sz}px;height:${sz}px"`:""}>${SPEAK_SVG}</button>`:"";

function entryHTML(w,{mode="both",examples=3}={}){
  return `<div class="hw">${esc(w.w)} ${sayBtn(w.w)}</div>
  <div class="meta"><span class="pos">${esc(w.pos)}</span><span>/${esc(w.ipa)}/</span></div>
  ${mode!=="en"?`<div class="tr">${esc(w.tr)}</div><div class="expl">${esc(w.expl)}</div>`:""}
  ${mode!=="ru"?`<div class="def">${esc(w.def)}</div>`:""}
  <ul class="ex">${w.ex.slice(0,examples).map(e=>`<li><div class="en">${highlight(w,e)}</div><div class="ru">${esc(e.ru)}</div></li>`).join("")}</ul>
  <div class="chips">${(w.col||[]).map(c=>`<span class="chip">${esc(c)}</span>`).join("")}${(w.syn||[]).map(c=>`<span class="chip syn">≈ ${esc(c)}</span>`).join("")}</div>`;
}

/* ---------- aggregates ---------- */
function lessonStats(L){
  const ws=WORDS.filter(w=>w.lesson===L), now=Date.now(); const byBox=[0,0,0,0,0,0]; let due=0;
  ws.forEach(w=>{const p=store.get(w.id);byBox[Math.min(5,p.b)]++; if(p.b>0&&p.d<=now)due++;});
  return {total:ws.length,byBox,due,fresh:byBox[0]};
}
function globalStats(){
  const now=Date.now(), byBox=[0,0,0,0,0,0]; let due=0;
  WORDS.forEach(w=>{const p=store.get(w.id);byBox[Math.min(5,p.b)]++;if(p.b>0&&p.d<=now)due++;});
  return {byBox,due};
}
function streak(){let n=0,t=Date.now();if(!store.stats.days[dayKey(t)])t-=DAY;while(store.stats.days[dayKey(t)]){n++;t-=DAY;}return n;}
function nextLesson(){ return LESSONS.find(l=>lessonStats(l.n).fresh>0) || LESSONS[0]; }

/* ---------- router ---------- */
let current="home", arg=null, session=null, deck=null;
function go(v,a=null){
  if(v!=="learn"&&session&&!session.finished){ session=null; }
  current=v; arg=a;
  const tab = v==="lesson"||v==="learn"?"home":v;
  document.querySelectorAll("#nav button").forEach(b=>b.dataset.v===tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  stopGarden();
  const vw=$("#view"); vw.classList.remove("enter");
  ({home:renderHome,lesson:renderLesson,learn:renderSession,cards:renderCards,dict:renderDict})[v]();
  void vw.offsetWidth; if(v!=="home") vw.classList.add("enter");
  window.scrollTo(0,0);
}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(session&&!session.finished&&current==="learn"&&!confirm("Прервать тренировку? Ответы уже сохранены."))return;go(b.dataset.v);});

function splitChars(t,serifIdx=[]){

/* ---------- flashcards ---------- */
let cardMode="ru";
try{ cardMode=localStorage.getItem("szs-mode")||"ru"; }catch{}
let cardScope={lesson:1};
function startCards(scope){ cardScope=scope||cardScope; deck=null; go("cards"); }
function buildDeck(){
  let ws;
  if(cardScope.lesson) ws=WORDS.filter(w=>w.lesson===cardScope.lesson);
  else if(cardScope.unit) ws=WORDS.filter(w=>LESSONS[w.lesson-1].unit===cardScope.unit);
  else if(cardScope.due){const now=Date.now();ws=WORDS.filter(w=>{const p=store.get(w.id);return p.b>0&&p.d<=now;});}
  else ws=WORDS.filter(w=>store.get(w.id).b>0);
  deck={items:shuffle(ws.map(w=>w.id)),i:0,known:0,again:0,flipped:false,total:ws.length};
}
function scopeOptions(){
  const opts=[`<option value="due" ${cardScope.due?"selected":""}>К повторению</option>`,`<option value="seen" ${cardScope.seen?"selected":""}>Все начатые слова</option>`];
  for(let u=1;u<=10;u++){
    const ls=LESSONS.filter(l=>l.unit===u);
    opts.push(`<optgroup label="Unit ${u} · ${esc(ls[0].unitName)}"><option value="u${u}" ${cardScope.unit===u?"selected":""}>Весь юнит ${u}</option>${ls.map(l=>`<option value="l${l.n}" ${cardScope.lesson===l.n?"selected":""}>${esc(l.name)}</option>`).join("")}</optgroup>`);
  }
  return opts.join("");
}
function renderCards(){
  if(!deck) buildDeck();
  const d=deck;
  const head=`<div class="page-h" style="margin-top:14px"><h1>Кар<span class="s">т</span>очки</h1>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <select class="field" id="scope" aria-label="Набор карточек">${scopeOptions()}</select>
      <div class="seg" role="group" aria-label="Режим"><button id="m-ru" aria-pressed="${cardMode==="ru"}">RU · перевод</button><button id="m-en" aria-pressed="${cardMode==="en"}">EN · explanation</button></div>
    </div></div>`;
  let body;
  if(!d.total){
    body=`<div class="glass done"><h2>Здесь пока пусто</h2><p class="muted">${cardScope.due?"Нет слов к повторению — отличная работа.":"Начните любую тему, и слова появятся здесь."}</p><div class="card-acts"><button class="btn" id="pickl1">Открыть Unit 1</button></div></div>`;
  } else if(d.i>=d.items.length){
    body=`<div class="glass done"><div class="label">Колода пройдена</div><h2 style="margin:12px 0">Помню ${d.known} из ${d.total}</h2><p class="muted">${d.again?`${d.again} ${plural(d.again,"раз","раза","раз")} слово возвращалось в колоду.`:"Все слова с первого раза."}</p>
    <div class="card-acts"><button class="btn" id="again">Ещё раз</button><button class="pearl sm" id="tolearn">Тренировать задания</button></div></div>`;
  } else {
    const w=BYID.get(d.items[d.i]), e=w.ex[0];
    const cols=(w.cols||[]).map(c=>`<li><span class="cc">${highlight(w,{en:c.c})}</span>${cardMode==="ru"?`<span class="cr">${esc(c.ru)}</span>`:""}</li>`).join("");
    d.angle = d.angle ?? 0;
    if(!!d.flipped !== (Math.round(d.angle/180)%2!==0)) d.angle = d.flipped?180:0;
    const face = `<div class="tiltw" id="tiltw"><div class="flipper" id="flipper" data-side="${d.flipped?"back":"front"}" style="transform:rotateY(${d.angle}deg)">
        <div class="card front" id="cardF"><div class="side">${sayBtn(w.w,34)}</div>
          <div class="word">${esc(w.w)}</div>
          <div class="sub"><span>/${esc(w.ipa)}/</span></div><div class="shine"></div></div>
        <div class="card back" id="cardB"><div class="side">${sayBtn(w.w,34)}</div>
          ${cardMode==="ru"?`<div class="answer-big">${esc(w.tr)}</div>`:`<div class="answer-def">${esc(w.def)}</div>`}
          ${cols?`<ul class="cols">${cols}</ul>`:""}<div class="shine"></div></div>
      </div></div>`;
    body=`<div class="prog"><span class="tn">${d.i+1}/${d.items.length}</span><div class="track"><i style="width:${d.i/d.items.length*100}%"></i></div><span>помню <span class="tn">${d.known}</span></span></div>
    <div class="flash ${d.anim||""}" id="flash">${face}</div>
    <div class="card-acts"><button class="btn" id="no">Не помню<span class="kbd">1</span></button><button class="btn" id="flip">Перевернуть<span class="kbd">пробел</span></button><button class="pearl sm" id="yes">Помню<span class="kbd">2</span></button></div>`;
  }
  $("#view").innerHTML=`<div class="stage" style="max-width:760px">${head}${body}</div>`;
  $("#m-ru").onclick=()=>setMode("ru"); $("#m-en").onclick=()=>setMode("en");
  $("#scope").onchange=e=>{const v=e.target.value;cardScope=v==="due"?{due:true}:v==="seen"?{seen:true}:v[0]==="u"?{unit:+v.slice(1)}:{lesson:+v.slice(1)};deck=null;renderCards();};
  d.anim="";
  const fl=$("#flipper"), tw=$("#tiltw");
  if(fl){
    const fit=()=>{const h=Math.max($("#cardF").scrollHeight,$("#cardB").scrollHeight);fl.style.height=h+"px";};
    fit(); if(document.fonts?.ready) document.fonts.ready.then(fit);
    fl.addEventListener("click",e=>{if(e.target.closest("[data-say]"))return;const r=fl.getBoundingClientRect();flip(e.clientX<r.left+r.width/2?-1:1);});
    if(!REDUCE&&matchMedia("(hover:hover)").matches){
      fl.addEventListener("pointermove",e=>{const r=fl.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
        tw.style.transform=`rotateY(${x*6}deg) rotateX(${-y*5}deg)`;
        fl.querySelectorAll(".card").forEach(c=>{c.style.setProperty("--x",(e.clientX-r.left)+"px");c.style.setProperty("--y",(e.clientY-r.top)+"px");});});
      fl.addEventListener("pointerleave",()=>tw.style.transform="");
    }
  }
  $("#flip")?.addEventListener("click",()=>flip(1));
  $("#yes")?.addEventListener("click",()=>rate(true));
  $("#no")?.addEventListener("click",()=>rate(false));
  $("#again")?.addEventListener("click",()=>{deck=null;renderCards();});
  $("#tolearn")?.addEventListener("click",()=>startSession(cardScope.lesson?{lesson:cardScope.lesson}:{due:true}));
  $("#pickl1")?.addEventListener("click",()=>{cardScope={lesson:1};deck=null;renderCards();});
}
function setMode(m){cardMode=m;try{localStorage.setItem("szs-mode",m);}catch{}renderCards();}
const FLIP_MS=780;
function flip(dir=1){
  const fl=$("#flipper"); if(!fl)return;
  deck.flipped=!deck.flipped;
  deck.angle=(deck.angle||0)+dir*180;
  if(REDUCE){fl.style.transform=`rotateY(${deck.angle}deg)`;fl.dataset.side=deck.flipped?"back":"front";return;}
  fl.classList.remove("flipping"); void fl.offsetWidth; fl.classList.add("flipping");
  fl.style.setProperty("--dir",dir);
  fl.style.transform=`rotateY(${deck.angle}deg)`;
  const side=deck.flipped?"back":"front";
  clearTimeout(flip.t1); clearTimeout(flip.t2);
  cancelAnimationFrame(flip.raf);
  const watch=()=>{const m=new DOMMatrix(getComputedStyle(fl).transform);
    const back=m.m11<0; // m11 = cos(угла): отрицательный — к нам повёрнута оборотная сторона
    fl.dataset.side=back?"back":"front"; if(fl.isConnected&&fl.classList.contains("flipping"))flip.raf=requestAnimationFrame(watch); else fl.dataset.side=side;};
  flip.raf=requestAnimationFrame(watch);
  flip.t2=setTimeout(()=>{fl.classList.remove("flipping");fl.dataset.side=side;},FLIP_MS+40);
}
let rating=false;
function rate(ok){
  if(rating)return; const fl=$("#flash"); deck.angle=0;
  if(fl&&!REDUCE){ rating=true; const r=fl.getBoundingClientRect(); 
    fl.classList.add(ok?"out-r":"out-l"); setTimeout(()=>{rating=false;rateNow(ok);},360); return; }
  rateNow(ok);
}
function rateNow(ok){
  const id=deck.items[deck.i], p={...store.get(id)};
  if(ok){ deck.known++; if(p.b===0){p.b=1;p.d=Date.now()+DAY-3600e3;} }
  else { deck.again++; deck.items.splice(Math.min(deck.items.length,deck.i+5),0,id); if(p.b>1){p.b=Math.max(1,p.b-1);p.d=Date.now()+10*60e3;} }
  store.set(id,p); store.bump();
  deck.i++; deck.flipped=false; renderCards();
  if(deck.i>=deck.items.length) celebrate();
}

/* ---------- learning session ---------- */
function startSession(scope){
  const now=Date.now();
  let pool=scope.lesson?WORDS.filter(w=>w.lesson===scope.lesson):WORDS;
  const due=shuffle(pool.filter(w=>{const p=store.get(w.id);return p.b>0&&p.d<=now;})).slice(0,REVIEW_PER_SESSION);
  let items=due.map(w=>({id:w.id,type:typeFor(w)}));
  const fresh=scope.due?[]:pool.filter(w=>store.get(w.id).b===0).slice(0,NEW_PER_SESSION);
  fresh.forEach((w,i)=>items.splice(Math.min(items.length,i*3),0,{id:w.id,type:"intro"}));
  fresh.forEach(w=>{const at=items.findIndex(x=>x.id===w.id);items.splice(Math.min(items.length,at+3),0,{id:w.id,type:"mc_en",graduate:true});});
  if(!items.length && scope.lesson){ // тема пройдена — повторим слабые
    items=shuffle(pool).sort((a,b)=>store.get(a.id).b-store.get(b.id).b).slice(0,12).map(w=>({id:w.id,type:typeFor(w),extra:true}));
  }
  if(!items.length){toast("Сейчас нечего повторять");return;}
  session={items,i:0,right:0,wrong:0,answered:false,finished:false,scope};
  go("learn");
}
function typeFor(w){
  const b=Math.min(store.get(w.id).b,5), t=[];
  if(b<=1) t.push("mc_ru","gap_choice","mc_def");
  else if(b===2) t.push("type_ru","gap_choice","mc_def");
  else if(b===3) t.push("type_ru","gap_type","gap_type");

  }
  function starflower(r,{blur=0}={}){ // эдельвейс

  /* ---- leaves & grass (drawn) ---- */
  function blade(x,bx,by,len,wid,bend,col,a){

  /* ---- scene ---- */
  function build(){
    SD=Math.min(2,devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*SD; cv.height=H*SD; seed=11;
    const LX=W/2, LY=H*.8;

      for(let i=0;i<40;i++){const px=LX+rr(-W*.3,W*.3),py=H*rr(.5,.75);const g=x.createRadialGradient(px,py,0,px,py,rr(20,60));g.addColorStop(0,"rgba(5,10,12,.35)");g.addColorStop(1,"rgba(5,10,12,0)");x.fillStyle=g;x.fillRect(0,0,W,H);}
      // дальний план: размытые силуэты

        x.strokeStyle=rgba([70,95,80],a);x.lineWidth=rr(.6,1.4);x.beginPath();x.moveTo(px,H);x.quadraticCurveTo(px+rr(-10,10),H-h*.5,px+rr(-14,14),H-h);x.stroke();

      x.filter="none";

      // густая листва у земли

        leaf(x,px,py+rr(0,30),rr(18,48),rr(5,12),rr(-2.9,-.25),[28+l*70,52+l*95,36+l*45],.55+l*.4);}

      for(let i=0;i<W/90;i++){const px=rr(0,W),l=lit(px,H*.85);fern(x,px,H*rr(.86,.98),rr(60,130),rr(-2.4,-.7),[40+l*70,80+l*90,55+l*40],.5+l*.4);}
      // мох и земля

      for(let i=0;i<W*5;i++){const px=rr(0,W),py=H*(1-Math.pow(R(),1.6)*.2),l=lit(px,py);

      x.fillStyle=lg;x.fillRect(0,0,W,H);

      else if(t<.42){kind="umbel";head=umbel(rr(12,22)*sc);}
      else if(t<.54){kind="clock";head=clock(rr(9,15)*sc);}
      else if(t<.62){kind="cosmos";head=cosmos(rr(8,13)*sc,{col:R()<.5?[222,196,210]:[236,232,222]});}
      else if(t<.7){kind="star";head=starflower(rr(7,12)*sc);}
      else if(t<.78){kind="spike";head=spike(rr(20,40)*sc,{col:R()<.5?[150,135,195]:[190,200,215]});}
      else if(t<.84){kind="marigold";head=marigold(rr(6,10)*sc);}
